<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de campagne — Studio Me&YouToo</title>
<meta name="description" content="Suivez votre campagne Me&YouToo et accédez à ses liens réels.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/brand/favicon.png">
<link rel="stylesheet" href="assets/css/style.css?v=20261030-nouveautes-1">
</head>
<body>
<a class="skip-link" href="#contenu">Aller au contenu</a>
<header class="mobile-header">
  <img class="studio-brand-logo" src="assets/img/brand/logo-studio-blue.png" alt="Le Studio Me&amp;YouToo">
  <button class="icon-button" aria-label="Ouvrir le menu" aria-expanded="false" data-menu-toggle><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<div class="app-shell">
  <aside class="sidebar" aria-label="Navigation principale" id="sidebar-root"></aside>
  <main class="main campaign-detail-page" id="contenu">
    <div id="campaign-detail-root"><p>Chargement de la campagne…</p></div>
  </main>
</div>
<nav class="bottom-nav" aria-label="Navigation mobile" id="bottom-nav-root"></nav>
<script src="assets/js/api.js?v=20261019-client-preview-1"></script>
<script src="assets/js/app.js?v=20261030-nouveautes-1"></script>
<script src="assets/js/content-adjustment.js?v=20260903-nested-adjustment-1"></script>
<script>
(function(){
  var root=document.getElementById('campaign-detail-root');
  var params=new URLSearchParams(location.search);
  var projectId=params.get('projectId')||params.get('id');

  // Lecture seule demandée côté client uniquement pour les campagnes programmées ou publiées.
  var READ_ONLY_STATUSES=new Set(['scheduled','published','active']);
  var currentUser=window.StudioAPI.user&&window.StudioAPI.user()||{};
  function can(permission){return currentUser.role==='admin'||Boolean(currentUser.permissions&&currentUser.permissions[permission]);}

  var ICONS={
    status:'<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11.5V16"/><circle cx="12" cy="8" r=".7" fill="currentColor" stroke="none"/></svg>',
    theme:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.3" fill="currentColor" stroke="none"/></svg>',
    start:'<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    end:'<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m8.5 15.5 2 2 4.5-4.5"/></svg>',
    results:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-5M12 16V8M16 16v-8"/></svg>',
    actions:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>',
    clock:'<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 3.2"/></svg>'
  };

  function esc(v){return String(v??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function dateFr(v){if(!v)return '—';var d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('fr-FR');}
  function dateFrPlusOneDay(v){
    if(!v)return '—';
    var d=new Date(v);
    if(Number.isNaN(d.getTime()))return '—';
    d.setDate(d.getDate()+1);
    return d.toLocaleDateString('fr-FR');
  }
  function statusLabel(s){return window.StudioStatus.label(s);}
  function statusClass(s){if(s==='published'||s==='active')return 'badge-success';if(s==='scheduled')return 'badge-info';if(s==='unpublished'||s==='closed'||s==='completed'||s==='archived')return 'badge-muted';return 'badge-info';}
  // Statut affiché : une campagne dont la date de fin est passée est présentée comme terminée.
  function campaignDisplayKey(p){
    if(p&&p.status==='archived')return 'archived';
    if(p&&p.close_date){var end=new Date(String(p.close_date).slice(0,10)+'T23:59:59');if(!Number.isNaN(end.getTime())&&end<new Date())return 'closed';}
    if(p&&p.status==='published'&&p.launch_date&&new Date(String(p.launch_date).slice(0,10)+'T00:00:00')<=new Date())return 'active';
    return p&&p.status;
  }
  function campaignDisplayStatus(p){return statusLabel(campaignDisplayKey(p));}
  function themeLabel(p){
    var raw=String(p.theme_title||p.theme_slug||'').trim();
    var slug=String(p.theme_slug||raw).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
    var labels={'sexisme':'Sexisme','management':'Management inclusif','management-inclusif':'Management inclusif','manager-inclusif':'Management inclusif','handicap':'Handicap','lgbt':'LGBT+','lgbt-plus':'LGBT+','origines':'Diversité des origines','diversite-des-origines':'Diversité des origines','religion':'Diversité religieuse','diversite-religieuse':'Diversité religieuse','intergenerationnel':'Intergénérationnel','collaborateur':'Collaborateur inclusif','collaborateur-inclusif':'Collaborateur inclusif'};
    return labels[slug]||raw||(p.legacy_history?'Base catalogue non reliée':'Thématique indisponible');
  }
  function projectQuery(p){
    // Campagnes historiques : elles peuvent ne pas être reliées à une base catalogue.
    // Dans ce cas on conserve leur slug legacy uniquement pour la navigation,
    // sans créer ni simuler de rattachement au catalogue.
    var slug=String(p.theme_slug||(p.legacy_history?p.legacy_slug:'')||'').trim();
    if(!slug)return '?projectId='+encodeURIComponent(p.id);
    return '?theme='+encodeURIComponent(slug)+'&projectId='+encodeURIComponent(p.id);
  }
  function contentPage(p){
    var q=projectQuery(p);
    return q ? 'composer.html'+q : null;
  }
  function respondentPreviewPage(p){
    var slug=String(p.theme_slug||(p.legacy_history?p.legacy_slug:'')||'').trim();
    if(p.id===undefined||p.id===null)return null;
    return 'apercu-repondant.html?mode=project&source=saved&projectId='+encodeURIComponent(p.id)+(slug?'&theme='+encodeURIComponent(slug):'');
  }
  function renderError(message){
    root.innerHTML='<div class="composer-alert">'+esc(message)+'</div><p><a class="button button-secondary" href="mes-campagnes.html" style="margin-top:12px">Retour à Mes campagnes</a></p>';
  }
  function render(p){
    var q=projectQuery(p);
    // Un import historique client peut volontairement être « Base catalogue : Non reliée ».
    // Cela ne doit jamais empêcher l'ouverture de la campagne : son contenu vit dans project_* .
    if(!p.legacy_history && !String(p.theme_slug||'').trim())
      return renderError('Le thème réel de cette campagne est absent des données API. Aucun thème de remplacement n’est utilisé.');
    var content=contentPage(p);
    var respondentPreview=respondentPreviewPage(p);
    var name=p.campaign_name||p.respondent_title||p.title||p.theme_title||'Campagne sans nom';
    var results=String(p.communication_results_url||'').trim();
    var isAdmin=currentUser.role==='admin';
    var adminBack=isAdmin?'<a class="button button-secondary" href="admin.html?tab=campaigns">← Retour aux campagnes</a>':'';
    var adminInfo=isAdmin?'<a class="button button-secondary" href="client.html?projectId='+encodeURIComponent(p.id)+'&manage=1">⚙️ Infos campagne</a>':'';
    var adminSettings=isAdmin?'<a class="button button-primary" href="parametrage.html?projectId='+encodeURIComponent(p.id)+'">⚙️ Paramétrage</a>':'';
    var resultsRestricted=Boolean(p.results_restricted);
    var share=String(p.communication_share_url||'').trim();
    var isDraft=p.status==='draft';
    var isReadOnly=READ_ONLY_STATUSES.has(p.status);
    var lifecycleActions='';
    if(p.status==='scheduled'&&can('manage_schedule'))lifecycleActions='<a class="button button-secondary" href="mes-campagnes.html?projectId='+encodeURIComponent(p.id)+'&action=extend">📅 Prolonger</a>';
    if((p.status==='published'||p.status==='active')&&can('manage_schedule'))lifecycleActions='<a class="button button-secondary" href="mes-campagnes.html?projectId='+encodeURIComponent(p.id)+'&action=extend">📅 Prolonger</a><a class="button button-danger-soft" href="mes-campagnes.html?projectId='+encodeURIComponent(p.id)+'&action=unpublish">⏹ Dépublier</a>';
    if(p.status==='unpublished')lifecycleActions='<a class="button button-primary" href="mes-campagnes.html?projectId='+encodeURIComponent(p.id)+'&action=reprogram">🚀 Reprogrammer</a><a class="button button-secondary" href="mes-campagnes.html?projectId='+encodeURIComponent(p.id)+'&action=archive">📦 Archiver</a>';
    if(p.status==='closed'||p.status==='completed'||p.status==='archived')lifecycleActions='<a class="button button-primary" href="mes-campagnes.html?projectId='+encodeURIComponent(p.id)+'&action=reprogram">🚀 Reprogrammer avec les mêmes liens</a>';
    if(currentUser.role==='admin'&&p.legacy_history&&p.status!=='draft')lifecycleActions+=(lifecycleActions?' ':'')+'<a class="button button-secondary" href="mes-campagnes.html?projectId='+encodeURIComponent(p.id)+'&action=mark-draft">📝 Remettre en brouillon</a>';
    // Répondants visibles par tous les comptes ; seul le lien stats détaillé dépend de l'accès aux résultats.
    var showRespondents=['scheduled','published','active','unpublished','closed','completed'].includes(p.status);
    detailedResults=!resultsRestricted&&Boolean(results);
    currentProject=p;resultsUrl=detailedResults?results:'';
    var resultsHtml=resultsRestricted
      ? '<span class="button button-locked" aria-disabled="true">🔒 Résultats détaillés réservés</span>'
      : results
      ? '<a class="button button-primary" href="'+esc(results)+'" target="_blank" rel="noopener">Voir les résultats ↗</a>'
      : '<span class="button button-secondary" aria-disabled="true">Résultats non disponibles</span>';

    var scheduleNote='';
    if(p.status==='scheduled'){
      scheduleNote='<div class="campaign-schedule-note">'+ICONS.clock+
        '<p>Cette campagne est programmée. Elle deviendra publiée automatiquement le <strong>'+dateFr(p.launch_date)+'</strong> et sera dépubliée le <strong>'+dateFrPlusOneDay(p.close_date)+'</strong>.</p>'+
      '</div>';
    }

    var actionsHtml;
    if(isDraft){
      actionsHtml=
        '<div class="action-bar">'+
          '<a class="button button-secondary" href="'+content+'">Modifier le contenu</a>'+
          (can('manage_kit')?'<a class="button button-tonal" href="kit-communication.html'+q+'">Kit de communication</a>':'')+
          (share?'<a class="button button-secondary" href="'+esc(share)+'" target="_blank" rel="noopener">Ouvrir le lien répondant ↗</a>':'')+
        '</div>';
    }else if(isReadOnly){
      actionsHtml=
        '<div class="campaign-lock-panel">'+
          '<div class="campaign-lock-head"><span class="campaign-lock-title">Revoir le contenu</span><span class="composer-lock-chip">🔒 Lecture seule</span></div>'+
          '<p class="campaign-lock-text">Vous pouvez revoir l’ensemble du contenu de cette campagne. Pour signaler précisément un changement, utilisez la demande d’ajustement guidée.</p>'+
        '</div>'+
        '<div class="action-bar">'+
          '<a class="button button-secondary" href="'+content+'">Revoir le contenu</a>'+
          (can('manage_kit')?'<a class="button button-tonal" href="kit-communication.html'+q+'">Kit de communication</a>':'')+
          (can('edit_campaigns')?'<button class="button button-primary" type="button" data-content-adjustment="multiple">Demander un ajustement</button>':'<span class="button button-locked" aria-disabled="true">🔒 Demander un ajustement</span>')+
          lifecycleActions+
          (share?'<a class="button button-secondary" href="'+esc(share)+'" target="_blank" rel="noopener">Ouvrir le lien répondant ↗</a>':'')+
        '</div>';
    }else{
      actionsHtml=
        '<div class="campaign-lock-panel">'+
          '<div class="campaign-lock-head"><span class="campaign-lock-title">Contenu de la campagne</span><span class="composer-lock-chip">🔒 Contenu verrouillé</span></div>'+
          '<p class="campaign-lock-text">Le contenu n’est pas accessible en modification dans ce statut. Vous pouvez signaler précisément le changement souhaité.</p>'+
        '</div>'+
        '<div class="action-bar">'+
          (can('manage_kit')?'<a class="button button-tonal" href="kit-communication.html'+q+'">Kit de communication</a>':'')+
          (can('edit_campaigns')?'<button class="button button-primary" type="button" data-content-adjustment="multiple">Demander un ajustement</button>':'<span class="button button-locked" aria-disabled="true">🔒 Demander un ajustement</span>')+
          lifecycleActions+
          (share?'<a class="button button-secondary" href="'+esc(share)+'" target="_blank" rel="noopener">Ouvrir le lien répondant ↗</a>':'')+
        '</div>';
    }

    var organizationName=String(p.organization_name||'').trim();
    var clientBadge=organizationName
      ? (currentUser.role==='admin'&&p.organization_id
          ? '<a class="tag-chip" href="client.html?organizationId='+encodeURIComponent(p.organization_id)+'" title="Ouvrir le dossier client">🏢 Client · '+esc(organizationName)+'</a>'
          : '<span class="tag-chip">🏢 Client · '+esc(organizationName)+'</span>')
      : '';

    root.innerHTML=''+
      '<div class="topbar compact-topbar"><div><p class="eyebrow"><a href="mes-campagnes.html">Mes campagnes</a></p><div class="badge-row">'+clientBadge+'<span class="badge '+statusClass(p.status)+'">'+esc(campaignDisplayStatus(p))+'</span><span class="tag-chip">'+esc(themeLabel(p))+'</span></div><h1 class="page-title">'+esc(name)+'</h1><p class="lead">Suivez les informations réelles de cette campagne et accédez aux éléments disponibles.</p></div><div class="top-actions">'+adminBack+adminInfo+adminSettings+(respondentPreview?'<a class="button button-secondary" href="'+respondentPreview+'" target="_blank" rel="noopener" title="Voir le parcours répondant avec le contenu réel enregistré pour cette campagne">👁 Aperçu répondant</a>':'')+(can('manage_kit')?'<a class="button button-primary" href="kit-communication.html'+q+'">Kit de communication</a>':'')+'</div></div>'+
      journeyHtml(p)+
      scheduleNote+
      (campaignEnded(p)?'<section class="campaign-celebration" id="campaign-celebration" hidden aria-live="polite"></section>':'')+
      '<section class="stats-grid" aria-label="Informations de la campagne">'+
        '<article class="stat-card"><div class="stat-icon">'+ICONS.status+'</div><p class="stat-label">Statut '+window.StudioStatus.dot(campaignDisplayKey(p))+'</p><p class="stat-value" style="font-size:1.5rem">'+esc(campaignDisplayStatus(p))+'</p></article>'+
        '<article class="stat-card"><div class="stat-icon">'+ICONS.theme+'</div><p class="stat-label">Thématique '+window.StudioGlossary.dot('thematique')+'</p><p class="stat-value" style="font-size:1.35rem">'+esc(themeLabel(p))+'</p></article>'+
        '<article class="stat-card"><div class="stat-icon">'+ICONS.start+'</div><p class="stat-label">Date de début</p><p class="stat-value" style="font-size:1.5rem">'+dateFr(p.launch_date)+'</p></article>'+
        '<article class="stat-card"><div class="stat-icon">'+ICONS.end+'</div><p class="stat-label">Date de fin</p><p class="stat-value" style="font-size:1.5rem">'+dateFr(p.close_date)+'</p></article>'+
      '</section>'+
      '<section class="hero-panel" style="display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:24px"><div><h2 class="section-title campaign-section-title"><span class="campaign-section-icon">'+ICONS.results+'</span>Résultats '+window.StudioGlossary.dot('resultats')+'</h2><p class="section-desc">'+(resultsRestricted?'Les résultats détaillés (par profil de répondants) sont réservés aux comptes autorisés. Le nombre de répondants reste visible ci-dessous.':results?'Le lien de résultats renseigné par Me&YouToo est disponible.':'Aucun lien de résultats n\'est encore renseigné pour cette campagne.')+'</p></div>'+resultsHtml+(showRespondents?'<div class="campaign-respondents" id="campaign-respondents" aria-live="polite"><span>Chargement du nombre de répondants…</span></div>':'')+'</section>'+
      '<section class="card" style="padding:26px" aria-labelledby="actions-title"><h2 class="section-title campaign-section-title" id="actions-title"><span class="campaign-section-icon">'+ICONS.actions+'</span>Actions sur la campagne</h2><p class="section-desc" style="margin-bottom:18px">'+(['unpublished','closed','completed','archived'].includes(p.status)?'Pour relancer ce thème, reprogrammez cette campagne : son contenu et ses liens seront conservés.':'Accédez uniquement aux éléments réellement associés à cette campagne.')+'</p>'+actionsHtml+'</section>';
    document.title=name+' — Suivi de campagne — Studio Me&YouToo';
    if(showRespondents)loadRespondents(p.id);
    if(campaignEnded(p))loadCelebration(p);
  }

  var currentProject=null,resultsUrl='';
  // Où en est la campagne, qui agit, et le bouton de l'action du moment quand elle revient au client.
  function journeyHtml(p){
    var key=campaignDisplayKey(p),q='?theme='+encodeURIComponent(p.theme_slug||'')+'&projectId='+encodeURIComponent(p.id),action=null;
    var resume={composer:'composer.html',personnalisation:'personnalisation.html',parametrage:'parametrage.html',validation:'validation.html'};
    if(key==='draft'&&can('edit_campaigns'))action={href:(resume[p.current_step]||'composer.html')+q,label:'Reprendre la création'};
    else if(key==='client_validation_required')action={href:'validation.html'+q,label:'Valider les corrections'};
    else if(['configuration_submitted','review_pending','in_review'].includes(key))action={href:'validation.html'+q,label:'Suivre la relecture'};
    else if(['ready_to_publish','scheduled','published','active'].includes(key)&&can('manage_kit'))action={href:kitHref(p),label:'Ouvrir le kit de communication'};
    else if(['closed','completed','archived','unpublished'].includes(key)&&can('create_campaigns'))action={href:'bibliotheque.html',label:'Choisir une nouvelle thématique'};
    var actions=[].concat(action||[]),lifecycle='mes-campagnes.html?projectId='+encodeURIComponent(p.id)+'&action=';
    if(can('manage_schedule')){
      // Mêmes règles que les actions de la campagne : on reprogramme une campagne arrêtée, on prolonge une campagne encore publiée.
      if(['unpublished','closed','completed','archived'].includes(p.status))actions.push({href:lifecycle+'reprogram',label:'Reprogrammer avec les mêmes liens'});
      else if(['scheduled','published','active'].includes(p.status)&&['scheduled','published','active','closed'].includes(key))actions.push({href:lifecycle+'extend',label:'Prolonger'});
    }
    var html=window.StudioJourney.html(key,actions);
    return html?'<section class="card studio-journey" aria-labelledby="journey-title"><h2 class="section-title" id="journey-title">Où en est votre campagne ?</h2>'+html+'</section>':'';
  }
  function campaignEnded(p){
    if(p.status==='closed'||p.status==='completed')return true;
    return p.status==='unpublished'&&Boolean(p.close_date)&&new Date(String(p.close_date).slice(0,10)+'T23:59:59')<new Date();
  }
  function isLive(p){return p&&(p.status==='published'||p.status==='active');}
  function kitHref(p){return 'kit-communication.html?projectId='+encodeURIComponent(p.id)+(p.theme_slug?'&theme='+encodeURIComponent(p.theme_slug):'');}
  function participation(respondents,objective){return objective>0&&respondents!=null?Math.round(respondents/objective*100):null;}

  // Jauge de participation : répondants sur l'objectif déclaré au paramétrage, repères 50 / 75 / 100 %.
  function participationHtml(count,objective){
    if(count==null||!objective)return '';
    var pct=participation(count,objective),shown=Math.min(100,pct),left=function(goal){return Math.max(0,Math.ceil(objective*goal/100)-count);};
    var message=pct>=100?'Objectif atteint ✓ Bravo, votre campagne a touché toutes les personnes visées.'
      :pct>=75?'75 % atteint 🔥 Plus que '+left(100).toLocaleString('fr-FR')+' répondants pour atteindre votre objectif.'
      :pct>=50?'50 % atteint 🎯 Encore '+left(75).toLocaleString('fr-FR')+' répondants pour passer à 75 %.'
      :'Encore '+left(50).toLocaleString('fr-FR')+' répondants pour atteindre 50 % de votre objectif.';
    var ticks=[[50,'🎯'],[75,'🔥'],[100,'✓']].map(function(t){return '<i class="cp-tick'+(pct>=t[0]?' is-reached':'')+'" style="left:'+t[0]+'%"><b>'+t[1]+' '+t[0]+' %</b></i>';}).join('');
    return '<div class="campaign-participation'+(pct>=100?' is-complete':'')+'">'+
      '<div class="campaign-participation-head"><strong>'+pct+' %</strong><span>de votre objectif de '+objective.toLocaleString('fr-FR')+' répondants</span></div>'+
      '<div class="cp-bar" role="progressbar" aria-label="Participation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+shown+'"><span class="cp-bar-fill" data-width="'+shown+'"></span>'+ticks+'</div>'+
      '<p>'+esc(message)+'</p>'+
      (isLive(currentProject)&&pct<75&&can('manage_kit')?'<a class="button button-primary cp-cta" href="'+kitHref(currentProject)+'">Relancer mes collaborateurs →</a>':'')+
    '</div>';
  }
  function fillBars(root){setTimeout(function(){(root||document).querySelectorAll('.cp-bar-fill').forEach(function(bar){bar.style.width=bar.dataset.width+'%';});},60);}

  // Fin de campagne : moment de satisfaction, puis la suite du parcours.
  async function loadCelebration(p){
    var box=document.getElementById('campaign-celebration');if(!box)return;
    try{
      var data=await StudioAPI.request('/api/me/program?projectId='+encodeURIComponent(p.id));
      var campaigns=Array.isArray(data.campaigns)?data.campaigns:[];
      var self=campaigns.find(function(c){return String(c.id)===String(p.id);});
      if(!self||self.respondents==null)return;
      var index=campaigns.indexOf(self),previous=campaigns.slice(0,index).reverse().find(function(c){return c.respondents!=null&&c.objective;});
      var pct=participation(self.respondents,self.objective),prevPct=previous?participation(previous.respondents,previous.objective):null;
      var total=campaigns.reduce(function(sum,c){return sum+(Number(c.respondents)||0);},0);
      var facts=['<li><strong>'+Number(self.respondents).toLocaleString('fr-FR')+'</strong><span>répondants</span></li>'];
      if(pct!=null)facts.push('<li><strong>'+pct+' %</strong><span>de votre objectif atteint</span></li>');
      if(pct!=null&&prevPct!=null){var diff=pct-prevPct;facts.push('<li><strong>'+(diff>=0?'+':'')+diff+' pts</strong><span>de participation par rapport à « '+esc(previous.name)+' »</span></li>');}
      facts.push('<li><strong>'+total.toLocaleString('fr-FR')+'</strong><span>répondants depuis votre arrivée sur Studio</span></li>');
      var confetti='';for(var i=0;i<18;i++)confetti+='<i style="--x:'+(Math.round(Math.random()*100))+'%;--d:'+(Math.random()*0.6).toFixed(2)+'s;--r:'+Math.round(Math.random()*360)+'deg"></i>';
      box.innerHTML='<div class="cc-confetti" aria-hidden="true">'+confetti+'</div>'+
        '<p class="cc-eyebrow">Campagne terminée</p><h2>Bravo, votre campagne est terminée 🎉</h2>'+
        '<ul class="cc-facts">'+facts.join('')+'</ul>'+
        '<div class="cc-actions">'+(resultsUrl?'<a class="button button-secondary" href="'+esc(resultsUrl)+'" target="_blank" rel="noopener">Voir mes résultats ↗</a>':'')+'</div>'+
        '<div class="cc-next"><div><strong>Et maintenant ?</strong><span>Continuez votre parcours avec une nouvelle thématique : votre pack est valable sur tous les diagnostics Me&amp;YouToo.</span></div><a class="button button-primary cc-cta" href="bibliotheque.html">Découvrir les diagnostics →</a></div>';
      box.hidden=false;
    }catch(e){}
  }

  // Répondants lus chaque nuit sur la page stats du moteur ; « Actualiser » relit tout de suite.
  var detailedResults=false;
  function respondentsInfo(){return 'Ce chiffre est mis à jour automatiquement chaque nuit. Cliquez sur « Actualiser » pour le voir dès maintenant'+(detailedResults?', ou ouvrez vos résultats détaillés avec « Voir les résultats »':'')+'. Un même collaborateur peut répondre plusieurs fois, le questionnaire étant anonyme : ce chiffre correspond au nombre de questionnaires complétés.';}
  function dateTimeFr(v){if(!v)return '';var d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
  function renderRespondents(stats,note){
    var box=document.getElementById('campaign-respondents');if(!box)return;
    if(stats&&stats.linked===false){box.hidden=true;return;}
    var count=stats&&stats.passations!=null?Number(stats.passations):null;
    box.innerHTML='<div class="campaign-respondents-value">'+
        (count==null?'<strong>Répondants : bientôt disponible</strong>':'<strong>'+count.toLocaleString('fr-FR')+'</strong> répondant'+(count>1?'s':''))+
        ' <button type="button" class="admin-info-dot" data-info="'+esc(respondentsInfo())+'" aria-label="Comprendre le nombre de répondants" aria-haspopup="dialog">i</button>'+
        (stats&&stats.readAt?'<span class="campaign-respondents-date">Mis à jour le '+dateTimeFr(stats.readAt)+'</span>':'')+
        (note?'<span class="campaign-respondents-note">'+esc(note)+'</span>':'')+
      '</div><button type="button" class="button button-secondary" id="refresh-respondents">Actualiser</button>'+
      participationHtml(count,stats&&stats.objective)+
      objectiveEditorHtml(stats);
    document.getElementById('refresh-respondents').onclick=refreshRespondents;
    bindObjectiveEditor(stats);
    fillBars(box);
  }

  // Objectif de participation : modifiable tant que la campagne n'est pas terminée, avec historique.
  var objectiveState={canEditObjective:false,objectiveHistory:[]};
  function objectiveEditorHtml(stats){
    if(stats&&stats.canEditObjective!==undefined)objectiveState={canEditObjective:stats.canEditObjective,objectiveHistory:stats.objectiveHistory||[]};
    var objective=stats&&stats.objective,history=objectiveState.objectiveHistory;
    if(!objectiveState.canEditObjective&&!history.length)return '';
    return '<div class="campaign-objective">'+
      (objectiveState.canEditObjective?'<button type="button" class="campaign-objective-toggle" data-objective-toggle>'+(objective?'✏️ Modifier l’objectif de participation':'🎯 Définir un objectif de participation')+'</button>'+
        '<form class="campaign-objective-form" data-objective-form hidden><label>Objectif de répondants<input type="number" min="1" max="1000000" step="1" required value="'+(objective||'')+'" data-objective-input></label>'+
        '<button type="submit" class="button button-primary">Enregistrer</button><button type="button" class="button button-secondary" data-objective-cancel>Annuler</button><span class="campaign-objective-error" data-objective-error hidden></span></form>':'')+
      (history.length?'<details class="campaign-objective-history"><summary>Historique de l’objectif</summary><ul>'+history.map(function(h){return '<li>'+dateTimeFr(h.changedAt)+' : '+(h.previous?Number(h.previous).toLocaleString('fr-FR')+' → ':'défini à ')+Number(h.value).toLocaleString('fr-FR')+' répondants</li>';}).join('')+'</ul></details>':'')+
    '</div>';
  }
  function bindObjectiveEditor(stats){
    var box=document.getElementById('campaign-respondents');if(!box)return;
    var toggle=box.querySelector('[data-objective-toggle]'),form=box.querySelector('[data-objective-form]');
    if(!toggle||!form)return;
    toggle.onclick=function(){form.hidden=!form.hidden;if(!form.hidden)form.querySelector('[data-objective-input]').focus();};
    form.querySelector('[data-objective-cancel]').onclick=function(){form.hidden=true;};
    form.onsubmit=async function(event){
      event.preventDefault();
      var error=form.querySelector('[data-objective-error]'),value=Number(form.querySelector('[data-objective-input]').value);
      try{renderRespondents(await StudioAPI.request('/api/projects/'+encodeURIComponent(projectId)+'/objective',{method:'PATCH',body:JSON.stringify({objective:value})}),'Objectif enregistré.');}
      catch(e){error.hidden=false;error.textContent=e.message||'Impossible d’enregistrer l’objectif.';}
    };
  }
  async function loadRespondents(id){
    try{renderRespondents(await StudioAPI.request('/api/projects/'+encodeURIComponent(id)+'/legacy-stats'));}
    catch(e){var box=document.getElementById('campaign-respondents');if(box)box.hidden=true;}
  }
  async function refreshRespondents(){
    var btn=document.getElementById('refresh-respondents');if(btn){btn.disabled=true;btn.textContent='Actualisation…';}
    try{
      var stats=await StudioAPI.request('/api/projects/'+encodeURIComponent(projectId)+'/legacy-stats/refresh',{method:'POST'});
      renderRespondents(stats,stats.recent?'Chiffre déjà à jour : il a été actualisé il y a moins de 5 minutes.':stats.refreshed?'':'Actualisation impossible pour le moment. Réessayez un peu plus tard.'+(detailedResults?' Vos résultats détaillés restent accessibles avec « Voir les résultats ».':''));
    }catch(e){if(btn){btn.disabled=false;btn.textContent='Actualiser';}}
  }

  async function load(){
    if(!projectId){renderError('Campagne introuvable : aucun identifiant de projet n’a été fourni.');return;}
    try{
      var data=await StudioAPI.request('/api/projects/'+encodeURIComponent(projectId)+'/composer');
      var p=data&&data.project;
      if(!p){renderError('Cette campagne n’existe pas dans les données de votre compte.');return;}
      render(p);
    }catch(e){renderError('Impossible de charger la campagne : '+(e.message||'Erreur inconnue'));}
  }
  load();
})();
</script>
</body>
</html>
