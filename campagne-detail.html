<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de campagne — Studio Me&YouToo</title>
<meta name="description" content="Suivez votre campagne Me&YouToo et accédez à ses liens réels.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/brand/favicon.png">
<link rel="stylesheet" href="assets/css/style.css?v=20260828-campaign-cards-1">
</head>
<body>
<a class="skip-link" href="#contenu">Aller au contenu</a>
<header class="mobile-header">
  <img src="assets/img/brand/logo-meayt-color.png" alt="Me&YouToo Studio">
  <button class="icon-button" aria-label="Ouvrir le menu" aria-expanded="false" data-menu-toggle><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<div class="app-shell">
  <aside class="sidebar" aria-label="Navigation principale" id="sidebar-root"></aside>
  <main class="main" id="contenu">
    <div id="campaign-detail-root"><p>Chargement de la campagne…</p></div>
  </main>
</div>
<nav class="bottom-nav" aria-label="Navigation mobile" id="bottom-nav-root"></nav>
<script src="assets/js/api.js?v=20260713-2"></script>
<script src="assets/js/app.js?v=20260828-admin-actions-1"></script>
<script>
(function(){
  var root=document.getElementById('campaign-detail-root');
  var params=new URLSearchParams(location.search);
  var projectId=params.get('projectId');

  function esc(v){return String(v??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function dateFr(v){if(!v)return '—';var d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('fr-FR');}
  function statusLabel(s){return {draft:'Brouillon',configuration_submitted:'Transmise à Me&YouToo',scheduled:'Programmée',published:'Publiée',active:'Publiée',unpublished:'Dépubliée',closed:'Terminée',completed:'Terminée',archived:'Archivée'}[s]||s||'Statut inconnu';}
  function statusClass(s){if(s==='published'||s==='active')return 'badge-success';if(s==='scheduled')return 'badge-info';if(s==='unpublished'||s==='closed'||s==='completed'||s==='archived')return 'badge-neutral';return 'badge-info';}
  function themeLabel(p){
    var raw=String(p.theme_title||p.theme_slug||'').trim();
    var slug=String(p.theme_slug||raw).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
    var labels={'sexisme':'Sexisme','management':'Management inclusif','management-inclusif':'Management inclusif','manager-inclusif':'Management inclusif','handicap':'Handicap','lgbt':'LGBT+','lgbt-plus':'LGBT+','origines':'Diversité des origines','diversite-des-origines':'Diversité des origines','religion':'Diversité religieuse','diversite-religieuse':'Diversité religieuse','intergenerationnel':'Intergénérationnel','collaborateur':'Collaborateur inclusif','collaborateur-inclusif':'Collaborateur inclusif'};
    return labels[slug]||raw||'Autodiagnostic D&I';
  }
  function contentPage(p){
    var slug=String(p.theme_slug||'').toLowerCase().trim();
    var pages={'sexisme':'theme-sexisme.html','management':'theme-management.html','management-inclusif':'theme-management.html','manager-inclusif':'theme-management.html','handicap':'theme-handicap.html','lgbt':'theme-lgbt.html','lgbt-plus':'theme-lgbt.html','origines':'theme-origines.html','diversite-des-origines':'theme-origines.html','religion':'theme-religion.html','diversite-religieuse':'theme-religion.html','intergenerationnel':'theme-intergenerationnel.html','collaborateur':'theme-collaborateur.html','collaborateur-inclusif':'theme-collaborateur.html'};
    return (pages[slug]||'composer.html')+'?theme='+encodeURIComponent(p.theme_slug||'sexisme')+'&projectId='+encodeURIComponent(p.id);
  }
  function render(p){
    var q='?theme='+encodeURIComponent(p.theme_slug||'sexisme')+'&projectId='+encodeURIComponent(p.id);
    var name=p.campaign_name||p.respondent_title||p.title||p.theme_title||'Campagne sans nom';
    var results=String(p.communication_results_url||'').trim();
    var share=String(p.communication_share_url||'').trim();
    var resultsHtml=results
      ? '<a class="button button-primary" href="'+esc(results)+'" target="_blank" rel="noopener">Voir les résultats ↗</a>'
      : '<span class="button button-secondary" aria-disabled="true">Résultats non disponibles</span>';
    root.innerHTML=''+
      '<div class="topbar compact-topbar"><div><p class="eyebrow"><a href="mes-campagnes.html">Mes campagnes</a></p><div class="badge-row"><span class="badge '+statusClass(p.status)+'">'+esc(statusLabel(p.status))+'</span><span class="tag-chip">'+esc(themeLabel(p))+'</span></div><h1 class="page-title">'+esc(name)+'</h1><p class="lead">Suivez les informations réelles de cette campagne et accédez aux éléments disponibles.</p></div><div class="top-actions"><a class="button button-primary" href="kit-communication.html'+q+'">Kit de communication</a></div></div>'+
      '<section class="stats-grid" aria-label="Informations de la campagne">'+
        '<article class="stat-card"><p class="stat-label">Statut</p><p class="stat-value" style="font-size:1.5rem">'+esc(statusLabel(p.status))+'</p></article>'+
        '<article class="stat-card"><p class="stat-label">Thématique</p><p class="stat-value" style="font-size:1.35rem">'+esc(themeLabel(p))+'</p></article>'+
        '<article class="stat-card"><p class="stat-label">Date de début</p><p class="stat-value" style="font-size:1.5rem">'+dateFr(p.launch_date)+'</p></article>'+
        '<article class="stat-card"><p class="stat-label">Date de fin</p><p class="stat-value" style="font-size:1.5rem">'+dateFr(p.close_date)+'</p></article>'+
      '</section>'+
      '<section class="hero-panel" style="display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:24px"><div><h2 class="section-title">Résultats</h2><p class="section-desc">'+(results?'Le lien de résultats renseigné par Me&YouToo est disponible.':'Aucun lien de résultats n\'est encore renseigné pour cette campagne.')+'</p></div>'+resultsHtml+'</section>'+
      '<section class="card" style="padding:26px" aria-labelledby="actions-title"><h2 class="section-title" id="actions-title">Actions sur la campagne</h2><p class="section-desc" style="margin-bottom:18px">Accédez uniquement aux éléments réellement associés à cette campagne.</p><div class="action-bar">'+
        '<a class="button button-secondary" href="'+contentPage(p)+'">Voir le contenu</a>'+
        '<a class="button button-tonal" href="kit-communication.html'+q+'">Kit de communication</a>'+
        (share?'<a class="button button-secondary" href="'+esc(share)+'" target="_blank" rel="noopener">Ouvrir la campagne ↗</a>':'')+
      '</div></section>';
    document.title=name+' — Suivi de campagne — Studio Me&YouToo';
  }

  async function load(){
    if(!projectId){root.innerHTML='<div class="composer-alert">Campagne introuvable : aucun identifiant de projet n\'a été fourni.</div>';return;}
    try{
      var data=await StudioAPI.request('/api/projects?organizationId='+encodeURIComponent(StudioAPI.organizationId()));
      var projects=Array.isArray(data.projects)?data.projects:[];
      var p=projects.find(function(x){return String(x.id)===String(projectId);});
      if(!p){root.innerHTML='<div class="composer-alert">Cette campagne n\'existe pas dans les données de votre compte.</div>';return;}
      render(p);
    }catch(e){root.innerHTML='<div class="composer-alert">Impossible de charger la campagne : '+esc(e.message||'Erreur inconnue')+'</div>';}
  }
  load();
})();
</script>
</body>
</html>
