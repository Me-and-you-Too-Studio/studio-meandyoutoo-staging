<script>
// Captures du 6 novembre 2026 (accueil, Cockpit, Mes campagnes, calendrier) : compte de démonstration Fatou Diallo, Entreprise Exemple (page entière à 88 %). Carte « Mise en place » ajoutée à l'affichage sur ecran-2 : Fatou a tout terminé, elle n'apparaît plus.
// Cadres en % de la capture : [gauche, haut, largeur, hauteur]. Pour caler la voix : audio:'voix.mp3' et « at » (secondes) sur chaque plan.
window.TUTO={
  eyebrow:'Tutoriel · Pour commencer',
  title:'Découvrir le Studio',
  intro:'L’accueil, le menu, vos campagnes, le calendrier, le Cockpit D&I et l’aide : le tour du Studio avant de vous lancer. Environ 2 minutes 30, avec le son.',
  // Voix de Carole Michelon (enregistrée le 5 novembre 2026 ; bruit de fond retiré, pauses ramenées à 1,2 s) ; « at » = début de chaque phrase.
  audio:'voix.mp3?v=2',
  scenes:[
    {at:0,img:'ecran-1.png?v=2',box:[20,4.5,42,16],text:'Bienvenue dans le Studio Me&YouToo : le tableau de bord de pilotage de votre politique diversité & inclusion, où vous créez, diffusez et suivez vos campagnes de sensibilisation.'},
    {at:9.55,img:'ecran-1.png?v=2',box:[20.6,21.6,38.6,11.4],text:'Créer une campagne prend environ 27 minutes, du choix de l’autodiagnostic à la transmission. Tout est enregistré : vous pouvez vous arrêter et reprendre quand vous voulez.'},
    {at:19.07,img:'ecran-1.png?v=2',box:[19.8,67.5,78.6,32.3],text:'Deux façons de démarrer : vous créez votre campagne vous-même à partir du catalogue, ou l’équipe Me&YouToo la prépare avec vous.'},
    {at:26.03,img:'ecran-1.png?v=2',box:[22,94.7,11.4,5],text:'C’est votre première campagne ? Cliquez sur « Me guider pas à pas » : le Studio vous accompagne à chaque étape, jusqu’à la transmission.'},
    {at:34.15,img:'ecran-2.png?v=2',box:[18.7,14.6,81,15],text:'La mise en place du Studio vous indique ce qu’il reste à faire : ajouter votre logo, inviter votre équipe, disposer d’un pack et transmettre une première campagne.'},
    {at:43.29,img:'ecran-1.png?v=2',box:[1.5,26.5,14.7,14.5],text:'Dans le menu, la rubrique « Piloter » regroupe vos outils du quotidien : le Cockpit D&I, le calendrier et toutes vos campagnes.'},
    {at:51.59,img:'ecran-5.png?v=3',box:[18.7,3,81,34],text:'Le Cockpit D&I est le tableau de bord de votre politique diversité et inclusion : vos actions, celles animées par Me&YouToo comme vos initiatives internes, et vos prestataires, réunis et archivés année après année.'},
    {at:63.25,img:'ecran-8.png?v=2',box:[18.7,8.4,81,64],text:'Fixez vos objectifs de l’année : la progression se calcule toute seule, et les points d’attention vous signalent où agir, comme une loi à anticiper ou un mois sans action.'},
    {at:72.55,img:'ecran-7.png',box:[27.1,0.5,46,99],text:'À tout moment, le Bilan D&I réunit vos actions, vos chiffres et vos objectifs dans un PDF prêt à partager avec la direction, le CSE ou dans le rapport RSE.'},
    {at:83.31,img:'ecran-3.png?v=2',box:[18.7,74,81,26],text:'Dans « Mes campagnes », retrouvez chaque campagne avec sa phase d’avancement. « À vous d’agir » signale qu’une action vous attend.'},
    {at:90.93,img:'ecran-4.png?v=2',box:[18.7,31,81,59],text:'Le calendrier affiche sur une même année vos campagnes, vos tâches, vos actions D&I et les temps forts, pour choisir le bon moment.'},
    {at:99.19,img:'ecran-1.png?v=2',box:[1.5,41.6,14.7,23.8],text:'« Lancer » ouvre le catalogue des autodiagnostics et la commande de passations. « S’informer » présente nos solutions et vos ressources.'},
    {at:107.51,img:'ecran-1.png?v=2',box:[1.5,65.8,14.7,14.6],text:'Vous avez des questions : la rubrique « Aide » propose la FAQ, la visite guidée à revoir et les nouveautés du Studio.'},
    {at:115.09,img:'ecran-6.png',box:[22,18.7,15,4.3],text:'Sur la plupart des écrans, le bouton « Voir le tuto » lance une courte vidéo et « Lire le guide » ouvre la fiche d’aide correspondante.'},
    {at:123.39,img:'ecran-1.png?v=2',box:[13,14.7,3.2,5.6],text:'La cloche de notification vous prévient à chaque étape importante. Vous recevez aussi un e-mail quand une action vous est demandée.'},
    {at:131.13,img:'ecran-1.png?v=2',box:[1.5,81,14.7,10.6],text:'Dans « Paramètres », gérez votre compte et invitez vos collègues : vous choisissez qui voit quelles campagnes dans « Accès et équipes ».'},
    {at:139.11,img:'ecran-2.png?v=2',box:[1.5,59.3,14.7,10.4],text:'Besoin d’un coup de main ? Contactez l’équipe Me&YouToo depuis ce bloc ou depuis le chat : nous sommes là pour vous accompagner.'}
  ],
  end:{title:'À vous de jouer',text:'Prochaine étape : choisir votre premier diagnostic dans le catalogue. Une question ? Le chat et l’équipe Me&YouToo sont là pour vous.'}
};
</script>
