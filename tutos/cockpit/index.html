<script>
// Captures du 7 novembre 2026 (écran 8, Bilan : 4 novembre ; écran 9, avis : 5 novembre) : compte de démonstration Fatou Diallo, Entreprise Exemple, actions et prestataires fictifs (page entière à 88 %). Fenêtres remplies puis annulées, rien enregistré.
// Les fenêtres « Nouvelle action », « Nouvel objectif » et « Votre avis » ont été ouvertes puis annulées : rien n'a été enregistré.
// Cadres en % de la capture : [gauche, haut, largeur, hauteur]. Pour caler la voix : audio:'voix.mp3' et « at » (secondes) sur chaque plan.
window.TUTO={
  eyebrow:'Tutoriel · Piloter',
  title:'Piloter avec le Cockpit D&I',
  intro:'Vos chiffres, vos actions, vos objectifs, vos échéances et votre Bilan : tout pour piloter votre politique diversité et inclusion. Environ 2 minutes 45, avec le son.',
  // Voix de Carole Michelon (enregistrée le 5 novembre 2026, phrases ajoutées le 7 novembre ; bruit de fond retiré, pauses ramenées à 1,2 s) ; « at » = début de chaque phrase.
  audio:'voix.mp3?v=2',
  scenes:[
    {at:0,img:'ecran-1.png?v=4',box:[18.7,3,81,40],text:'Le Cockpit D&I est le tableau de bord de votre politique diversité et inclusion : vous allez pouvoir y piloter toutes vos actions, et les archiver année après année.'},
    {at:9.59,img:'ecran-10.png',box:[18.7,64.5,81,17.8],text:'Votre année en chiffres : actions menées, personnes sensibilisées, formats, thématiques couvertes et mois sans action. Tout se calcule à partir de vos actions et de vos diagnostics comportementaux.'},
    {at:20.33,img:'ecran-4.png?v=4',box:[18.7,36,81,64],text:'Dans « Actions », retrouvez tout ce que vous mettez en place : baromètres, formations, accords, ateliers. Les interventions animées par Me&YouToo et vos campagnes de diagnostic s’y ajoutent automatiquement.'},
    {at:31.26,img:'ecran-5.png?v=3',box:[30.9,0,38.4,100],text:'Ajoutez également vos propres actions en quelques clics : type, dates, thématiques, public visé, personnes sensibilisées et prestataire.'},
    {at:38.4,img:'ecran-14.png',box:[31.2,2,35,92],text:'Notez aussi l’objectif et les résultats, ainsi que le budget, que Me&YouToo ne voit pas, et joignez vos documents.'},
    {at:45.13,img:'ecran-12.png',box:[19.6,52,80,47.8],text:'Un dispositif réunit plusieurs actions et diagnostics sous un même nom, par exemple pour la SEEPH : vous suivez ainsi un programme complet, et non des actions isolées.'},
    {at:54.74,img:'ecran-2.png?v=4',box:[18.7,19.8,40.4,28],text:'Vous pouvez fixer par exemple trois à cinq objectifs pour l’année : la progression se calcule toute seule à partir de vos actions et de vos diagnostics.'},
    {at:63.52,img:'ecran-6.png?v=3',box:[30.9,12.7,38.4,75],text:'Un objectif peut être un enjeu stratégique, avec ses thématiques et ses publics visés, ou un objectif chiffré, comme un nombre de personnes à toucher.'},
    {at:71.54,img:'ecran-2.png?v=4',box:[59.7,19.8,40,28],text:'Le graphique compare, trimestre par trimestre, ce qui est réalisé, ce qui est en cours ou prévu, et ce qui est en retard.'},
    {at:78.66,img:'ecran-2.png?v=4',box:[18.7,48.8,40.4,51],text:'Les prochaines échéances listent vos soixante prochains jours : actions, campagnes, tâches et temps forts D&I. « Préparer » crée l’action en un clic.'},
    {at:89.04,img:'ecran-2.png?v=4',box:[59.7,48.8,40,32],text:'Les points d’attention vous signalent où agir : une loi à anticiper, un mois qui ne comporte aucune action, des thématiques non travaillées depuis douze mois.'},
    {at:98.09,img:'ecran-11.png',box:[18.7,21,81.2,76.5],text:'Votre programme est-il équilibré ? Vos actions sont classées en cinq familles : sensibilisation, formation, écoute et mesure, engagement et culture, politique et process. Vous voyez tout de suite ce qu’il manque.'},
    {at:109.27,img:'ecran-3.png?v=4',box:[18.7,19,81.2,80.5],text:'La frise montre votre année d’un coup d’œil, action par action. Sur un mois vide, saisissez une action pour garder la dynamique. Chaque graphique s’exporte en image pour vos présentations.'},
    {at:119.83,img:'ecran-7.png?v=3',box:[18.7,40,81,60],text:'Renseignez aussi vos prestataires avec « Ajouter un prestataire » : cabinets, formateurs, associations. Leurs coordonnées restent à portée de main et ils sont reliés à vos actions.'},
    {at:129.51,img:'ecran-9.png?v=2',box:[31.3,10,37.6,80],text:'Une fois une action terminée, donnez votre avis : des étoiles, un commentaire, et si vous referiez appel à ce prestataire. Sa fiche résume vos avis, et « Prévoir un rappel » ajoute une tâche à votre calendrier pour y repenser au bon moment.'},
    {at:143.02,img:'ecran-13.png',box:[22.3,32.4,55.4,35.4],text:'Pour l’année suivante, « Préparer mon programme » vous guide en deux étapes : cochez ce que vous voulez reprendre, puis estimez les participations visées pour chaque diagnostic.'},
    {at:152.24,img:'ecran-8.png',box:[27.1,0.5,46,99],text:'À tout moment, le Bilan D&I réunit vos actions, vos chiffres, vos objectifs et vos perspectives,'},
    {at:157.2,img:'ecran-15.png',box:[74.5,0.6,23.5,5.4],text:'dans un PDF ou un PowerPoint modifiable, prêts à partager avec la direction, le CSE ou dans le rapport RSE.'}
  ],
  end:{title:'Votre Cockpit D&I est prêt',text:'Prochaine étape : ajouter vos premières actions et fixer vos objectifs de l’année. Une question ? Le chat et l’équipe Me&YouToo sont là pour vous.'}
};
</script>
