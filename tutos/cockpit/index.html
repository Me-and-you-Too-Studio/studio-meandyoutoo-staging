<script>
// Captures du 5 novembre 2026 (nouveau bandeau, onglets et barre de boutons ; le Bilan, écran 8, date du 4 novembre) : compte de démonstration Fatou Diallo, Entreprise Exemple, actions et prestataires fictifs (page entière à 88 %).
// Les fenêtres « Nouvelle action », « Nouvel objectif » et « Votre avis » ont été ouvertes puis annulées : rien n'a été enregistré.
// Cadres en % de la capture : [gauche, haut, largeur, hauteur]. Pour caler la voix : audio:'voix.mp3' et « at » (secondes) sur chaque plan.
window.TUTO={
  eyebrow:'Tutoriel · Piloter',
  title:'Piloter avec le Cockpit D&I',
  intro:'Vos chiffres, vos actions, vos objectifs, vos échéances et votre Bilan : tout pour piloter votre politique diversité et inclusion. Environ 2 minutes 10, avec le son.',
  // Voix de Carole Michelon (enregistrée le 5 novembre 2026 ; bruit de fond retiré, pauses ramenées à 1,2 s) ; « at » = début de chaque phrase.
  audio:'voix.mp3?v=1',
  scenes:[
    {at:0,img:'ecran-1.png?v=3',box:[18.7,3,81,34],text:'Le Cockpit D&I est le tableau de bord de votre politique diversité et inclusion : vous allez pouvoir y piloter toutes vos actions, et les archiver année après année.'},
    {at:9.59,img:'ecran-1.png?v=3',box:[18.7,78.8,81,18],text:'Votre année en chiffres : actions menées, personnes sensibilisées, formats, thématiques couvertes et mois sans action. Tout se calcule à partir de vos actions et de vos diagnostics comportementaux.'},
    {at:20.33,img:'ecran-4.png?v=3',box:[18.7,30.6,81,68.5],text:'Dans « Actions », retrouvez tout ce que vous mettez en place : baromètres, formations, accords, ateliers. Les interventions animées par Me&YouToo et vos campagnes de diagnostic s’y ajoutent automatiquement.'},
    {at:31.11,img:'ecran-5.png?v=2',box:[32.4,0.9,35.1,98.2],text:'Ajoutez également vos propres actions en quelques clics : type, dates, thématiques, public visé, nombre de personnes touchées et prestataire. Vous pouvez ensuite y joindre vos documents.'},
    {at:41.31,img:'ecran-2.png?v=3',box:[18.7,8.4,40.4,28],text:'Vous pouvez fixer par exemple trois à cinq objectifs pour l’année : la progression se calcule toute seule à partir de vos actions et de vos diagnostics.'},
    {at:50.09,img:'ecran-6.png?v=2',box:[31.3,7.1,37.6,85.9],text:'Un objectif peut être un enjeu stratégique, avec ses thématiques et ses publics visés, ou un objectif chiffré, comme un nombre de personnes à toucher.'},
    {at:58.11,img:'ecran-2.png?v=3',box:[59.7,8.4,40,28],text:'Le graphique compare, trimestre par trimestre, ce qui est réalisé, ce qui est en cours ou prévu, et ce qui est en retard.'},
    {at:65.23,img:'ecran-2.png?v=3',box:[18.7,37.2,40.4,62.6],text:'Les prochaines échéances listent vos soixante prochains jours : actions, campagnes, tâches et temps forts D&I. « Préparer » crée l’action en un clic.'},
    {at:75.61,img:'ecran-2.png?v=3',box:[59.7,37.2,40,35],text:'Les points d’attention vous signalent où agir : une loi à anticiper, un mois qui ne comporte aucune action, des thématiques non travaillées depuis douze mois.'},
    {at:84.51,img:'ecran-3.png?v=3',box:[18.7,11.4,81.2,72.4],text:'La frise montre votre année d’un coup d’œil, action par action. Sur un mois vide, saisissez une action pour garder la dynamique. Chaque graphique s’exporte en image pour vos présentations.'},
    {at:95.07,img:'ecran-7.png?v=2',box:[18.1,30.6,81.6,69.1],text:'Renseignez aussi vos prestataires avec « Ajouter un prestataire » : cabinets, formateurs, associations. Leurs coordonnées restent à portée de main et ils sont reliés à vos actions.'},
    {at:104.75,img:'ecran-9.png?v=2',box:[31.3,10,37.6,80],text:'Une fois une action terminée, donnez votre avis : des étoiles, un commentaire, et si vous referiez appel à ce prestataire. Sa fiche résume vos avis, et « Prévoir un rappel » ajoute une tâche à votre calendrier pour y repenser au bon moment.'},
    {at:118.11,img:'ecran-8.png',box:[27.1,0.5,46,99],text:'À tout moment, le Bilan D&I réunit vos actions, vos chiffres, vos objectifs et vos perspectives dans un PDF prêt à partager avec la direction, le CSE ou dans le rapport RSE.'}
  ],
  end:{title:'Votre Cockpit D&I est prêt',text:'Prochaine étape : ajouter vos premières actions et fixer vos objectifs de l’année. Une question ? Le chat et l’équipe Me&YouToo sont là pour vous.'}
};
</script>
