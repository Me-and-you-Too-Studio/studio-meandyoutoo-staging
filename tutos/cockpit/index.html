  scenes:[
    {img:'ecran-1.png',box:[18.4,9,49.5,30],text:'Le Cockpit D&I est le tableau de bord de votre politique diversité et inclusion : vous allez pouvoir y piloter toutes vos actions, et les archiver année après année.'},
    {img:'ecran-1.png',box:[18.4,79,81.2,18],text:'Votre année en chiffres : actions menées, personnes sensibilisées, formats, thématiques couvertes et mois sans action. Tout se calcule à partir de vos actions et de vos diagnostics comportementaux.'},
    {img:'ecran-4.png',box:[18.4,29.6,81.2,47.3],text:'Dans « Actions », retrouvez tout ce que vous mettez en place : baromètres, formations, accords, ateliers. Les interventions animées par Me&YouToo et vos campagnes de diagnostic s’y ajoutent automatiquement.'},
    {img:'ecran-5.png',box:[31.7,0,37.4,100],text:'Ajoutez également vos propres actions en quelques clics : type, dates, thématiques, public visé, nombre de personnes touchées et prestataire. Vous pouvez ensuite y joindre vos documents.'},
    {img:'ecran-2.png',box:[18.4,0.6,40.4,27.4],text:'Vous pouvez fixer par exemple trois à cinq objectifs pour l’année : la progression se calcule toute seule à partir de vos actions et de vos diagnostics.'},
    {img:'ecran-6.png',box:[31.7,7.2,37.4,85.5],text:'Un objectif peut être un enjeu stratégique, avec ses thématiques et ses publics visés, ou un objectif chiffré, comme un nombre de personnes à toucher.'},
    {img:'ecran-2.png',box:[59.5,0.6,40.1,27.4],text:'Le graphique compare, trimestre par trimestre, ce qui est réalisé, ce qui est en cours ou prévu, et ce qui est en retard.'},
    {img:'ecran-2.png',box:[18.4,29.6,40.4,69.8],text:'Les prochaines échéances listent vos soixante prochains jours : actions, campagnes, tâches et temps forts D&I. « Préparer » crée l’action en un clic.'},
    {img:'ecran-2.png',box:[59.5,29.6,40.1,32],text:'Les points d’attention vous signalent où agir : une loi à anticiper, un mois qui ne comporte aucune action, des thématiques non travaillées depuis douze mois.'},
    {img:'ecran-3.png',box:[18.4,11.6,81.2,71.9],text:'La frise montre votre année d’un coup d’œil, action par action. Sur un mois vide, saisissez une action pour garder la dynamique. Chaque graphique s’exporte en image pour vos présentations.'},
    {img:'ecran-7.png',box:[18.4,40.4,81.2,41],text:'Renseignez aussi vos prestataires avec « Ajouter un prestataire » : cabinets, formateurs, associations. Leurs coordonnées restent à portée de main et ils sont reliés à vos actions.'},
    {img:'ecran-9.png',box:[31.3,9.8,37.7,80.1],text:'Une fois une action terminée, donnez votre avis : des étoiles, un commentaire, et si vous referiez appel à ce prestataire. Sa fiche résume vos avis, et « Prévoir un rappel » ajoute une tâche à votre calendrier pour y repenser au bon moment.'},
    {img:'ecran-8.png',box:[27.1,0.5,46,99],text:'À tout moment, le Bilan D&I réunit vos actions, vos chiffres, vos objectifs et vos perspectives dans un PDF prêt à partager avec la direction, le CSE ou dans le rapport RSE.'}
