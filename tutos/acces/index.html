window.TUTO={
  eyebrow:'Tutoriel · Compte et accès',
  title:'Gérer votre compte et vos accès',
  intro:'Votre compte, vos collègues, leurs droits, les dossiers d’équipe et « Qui voit quoi » : décidez qui peut faire quoi, et qui voit quelles campagnes. Environ 2 minutes 40.',
  scenes:[
    {img:'ecran-1.png',box:[18.4,24.3,81.2,28.4],text:'Dans « Mon compte », retrouvez votre solde de passations, la validité de votre pack et votre formule. Le solde est commun à toute l’entreprise.'},
    {img:'ecran-1.png',box:[18.4,55,40,43],text:'Votre profil regroupe votre fonction, votre e-mail et votre téléphone. Cliquez sur « Modifier mes informations » pour les tenir à jour, ou changez votre photo.'},
    {img:'ecran-1.png',box:[59.7,55,39.9,43],text:'Ajoutez le logo de votre organisation : il apparaît dans le Studio pour tous vos utilisateurs, et aussi sur vos QR codes.'},
    {img:'ecran-2.png',box:[18.4,55.5,81.2,9.8],text:'Vos campagnes et vos résultats ne sont visibles que par les personnes autorisées de votre organisation. Votre mot de passe se change ici.'},
    {img:'ecran-2.png',box:[18.8,68.5,80.4,29.3],text:'Pour inviter un collègue, cliquez sur « Ajouter un accès ». Chaque compte s’affiche ici, avec son niveau d’accès et ce qu’il peut voir.'},
    {img:'ecran-3.png',box:[35.4,9.8,29.4,36.5],text:'Renseignez son prénom, son nom, sa fonction et son e-mail professionnel, puis choisissez son niveau d’accès dans la liste.'},
    {img:'ecran-3.png',box:[35.4,49,29.2,43],text:'Les droits s’ajustent un par un si besoin. Cliquez ensuite sur « Créer et inviter » pour ouvrir son compte et l’inviter.'},
    {img:'ecran-4.png',box:[20.4,29.4,77.4,13.4],text:'Dans « Accès et équipes », trois principes : le niveau d’accès dit ce qu’une personne peut faire, le périmètre ce qu’elle voit, et les dossiers regroupent campagnes et actions.'},
    {img:'ecran-5.png',box:[29,8.8,42.8,75.9],text:'Il y a quatre niveaux : responsable du compte, gestionnaire de campagnes, contributeur et lecture seule. Ce tableau compare leurs droits, que vous pouvez ajuster personne par personne.'},
    {img:'ecran-6.png',box:[18.4,27.2,19.6,71.9],text:'Créez un dossier par sujet ou par équipe, par exemple Handicap, puis ajoutez-y vos campagnes et vos actions du Cockpit. L’équipe du dossier les voit.'},
    {img:'ecran-6.png',box:[18.4,12.2,81.2,13.2],text:'Attention : une campagne sans dossier n’est visible que des comptes « Toutes les campagnes ». Le Studio vous signale ce qui reste à ranger.'},
    {img:'ecran-7.png',box:[20.4,4.5,77.4,61.4],text:'Vous pouvez aussi changer le dossier de chaque campagne directement dans cette liste : c’est le moyen le plus rapide de tout ranger d’un coup.'},
    {img:'ecran-8.png',box:[18.4,46.2,81.2,37.8],text:'« Qui voit quoi » résume chaque compte : ce qu’il peut faire et ce qu’il voit. Un signal d’alerte repère tout compte qui ne voit aucune campagne.'},
    {img:'ecran-4.png',box:[20.4,82.5,12.4,13],text:'Me&YouToo peut vous suggérer des personnes à intégrer. Vous décidez : aucun e-mail ne leur est envoyé tant que vous ne cliquez pas sur « Envoyer l’invitation ».'},
    {img:'ecran-4.png',box:[18.4,71,81.2,27.5],text:'La frise suit votre paramétrage en six étapes, jusqu’à la vérification de « Qui voit quoi ». Une étape repasse à faire si la situation change, par exemple quand une personne arrive.'}
  ],
