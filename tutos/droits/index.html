  scenes:[
    {img:'ecran-1.png',box:[20.4,29.4,77.4,7],text:'Dans le Studio, deux réglages décident de tout : le niveau d’accès dit ce qu’une personne peut faire, et le périmètre dit ce qu’elle voit.'},
    {img:'ecran-2.png',box:[29,8.8,42.8,75.9],text:'Commençons par les niveaux. Il y en a quatre : responsable du compte, gestionnaire de campagnes, contributeur et lecture seule. Ce tableau montre les treize droits de chacun.'},
    {img:'ecran-2.png',box:[46,8.8,7.4,75.9],text:'Le responsable du compte a toujours tous les droits et voit toujours tout. Par défaut, lui seul gère les comptes et commande des passations.'},

    {img:'ecran-2.png',box:[29,14.8,42.8,4.4],text:'Regardons maintenant les droits. « Gérer les comptes et les accès » permet d’inviter des collègues, de modifier leurs droits, de désactiver leur compte et de changer le logo. Les dossiers d’équipe et les périmètres restent réservés au responsable du compte.'},

    {img:'ecran-2.png',box:[29,62.5,42.8,8.7],text:'Commander des passations est réservé par défaut au responsable du compte. Le gestionnaire de campagnes peut suivre les commandes, sans en passer.'},

    {img:'ecran-5.png',box:[20.4,52.3,77.4,18.4],text:'Le solde de passations est commun, mais une personne limitée ne voit que ses commandes. La vue d’ensemble et les objectifs de l’année restent aux comptes « Toutes les campagnes ».'},
